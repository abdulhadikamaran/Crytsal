<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrystalClear - Text Reconstruction</title>
  <!-- Tailwind CSS is now loaded via PostCSS/Autoprefixer in index.css -->
  <style>
    /* CRITICAL: Force Dimensions Immediately - NO IMPORTS HERE to avoid blocking */
    html,
    body {
      width: 380px !important;
      height: 500px !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f3f4f6;
      /* Prevents white flash */
    }
  </style>

  <!-- Load Fonts Async (or deferred) so they don't block the box size -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
